<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password | Savant</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/style-boot.js"></script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/screens/onboarding.css">
</head>
<body class="ob ob-login">
  <header class="site-header" id="header"></header>
  <main class="auth">
    <div class="card auth-card">
      <h1>Set a new password</h1>
      <p class="auth-sub hidden" id="intro">You'll sign in with it next. This signs you out on your other devices.</p>
      <div id="error" class="notice notice-error hidden" role="alert"></div>
      <div id="dead" class="hidden">
        <div class="notice notice-error" role="alert">This link has run out or has already been used. Ask for a new one.</div>
        <p class="auth-switch"><a href="/forgot-password">Ask for a new link</a></p>
      </div>
      <form id="reset-form" class="hidden" novalidate>
        <label class="field"><span>New password</span>
          <input type="password" id="password" autocomplete="new-password" required minlength="8">
          <span class="tiny muted field-hint">At least 8 characters.</span>
        </label>
        <label class="field"><span>New password again</span>
          <input type="password" id="again" autocomplete="new-password" required minlength="8">
        </label>
        <button class="btn btn-primary btn-block btn-lg" id="submit" type="submit">Save new password</button>
      </form>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/password-reset.js"></script>
</body>
</html>
