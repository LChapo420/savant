<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Polymath</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="header"></header>
  <main class="auth">
    <div class="card auth-card">
      <h1>Sign in</h1>
      <p class="auth-sub">Your path is where you left it.</p>
      <div id="error" class="notice notice-error hidden" role="alert"></div>
      <form id="form" novalidate>
        <label class="field"><span>Email</span>
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="field"><span>Password</span>
          <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block btn-lg" id="submit" type="submit">Sign in</button>
      </form>
      <p class="auth-switch">
        New here? <a href="/register">Create an account</a>
      </p>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
