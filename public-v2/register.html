<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | Polymath</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header" id="header"></header>
  <main class="auth">
    <div class="card auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Next you pick your subjects and take a short placement quiz for each one.</p>
      <div id="error" class="notice notice-error hidden" role="alert"></div>
      <form id="form" novalidate>
        <label class="field"><span>Name</span>
          <input type="text" id="display_name" autocomplete="name" required minlength="2" maxlength="32">
        </label>
        <label class="field"><span>Email</span>
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label class="field"><span>Password</span>
          <input type="password" id="password" autocomplete="new-password" required minlength="8">
          <span class="tiny muted field-hint">At least 8 characters.</span>
        </label>
        <button class="btn btn-primary btn-block btn-lg" id="submit" type="submit">Create account</button>
      </form>
      <p class="auth-switch">
        Already have one? <a href="/login">Sign in</a>
      </p>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
