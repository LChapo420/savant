<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Path</title>
  <!-- The piano song path: the song library by grade, with the stars each learner has
       earned, kept on the server (routes/piano-songs.js). Opening a song plays it here. -->
  <style>
    :root { --bg: #090d16; --card: #111827; --line: #1f293d; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; --star: #fbbf24; --locked: #334155; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    h1 { font-size: 1.4rem; margin: 0; }
    a { color: #7dd3fc; }
    .lead { margin: 0 0 18px; color: var(--muted); font-size: .92rem; line-height: 1.5; }
    .total { color: var(--star); font-weight: 700; }
    .grade { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 8px; margin-bottom: 16px; }
    .grade h2 { margin: 0; font-size: 1rem; }
    .grade .sub { color: var(--muted); font-size: .8rem; margin: 2px 0 10px; }
    .badge { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: var(--bg); font-size: .7rem; font-weight: 700; vertical-align: middle; }
    .path { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
    .stop { display: flex; align-items: center; gap: 12px; width: 70%; min-height: 64px; }
    .stop:nth-child(4n+2) { margin-left: 15%; }
    .stop:nth-child(4n+3) { margin-left: 30%; }
    .stop:nth-child(4n+4) { margin-left: 15%; }
    .node { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--accent); background: radial-gradient(circle at 35% 30%, #1e3a5f, #0b1a2c); color: var(--text); font-size: 22px; cursor: pointer; display: grid; place-items: center; }
    .node:hover:not(:disabled), .node:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }
    .node.is-done { border-color: var(--star); background: radial-gradient(circle at 35% 30%, #5b4410, #2a1f05); }
    .node:disabled { border-color: var(--locked); background: #0f1522; color: #475569; cursor: default; }
    .label { min-width: 0; }
    .label b { display: block; font-size: .92rem; line-height: 1.3; }
    .label span { font-size: .78rem; color: var(--muted); }
    .stars { color: var(--star); letter-spacing: 2px; font-size: .95rem; }
    .stars .off { color: var(--locked); }
    #player { margin-top: 8px; scroll-margin-top: 12px; }
    .notice { padding: 12px 14px; border: 1px solid #334155; border-radius: 10px; color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
    @media (max-width: 520px) { .stop { width: 100%; } .stop:nth-child(n) { margin-left: 0; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Song path</h1>
      <span class="total" id="total"></span>
    </header>
    <p class="lead">Short public-domain songs in our own arrangements, from your first black-key tunes up. Each song opens when the one before it has a star. Learn mode earns up to 2 stars; the third is for playing it in time at medium or full speed.</p>
    <div id="notice"></div>
    <div id="path"><p class="lead">Loading your songs...</p></div>
    <section id="player" data-block="Piano_Song"></section>
  </main>
  <script src="piano-core.js"></script>
  <script src="piano-io.js"></script>
  <script src="piano-song.js"></script>
  <script src="songs.js"></script>
</body>
</html>
