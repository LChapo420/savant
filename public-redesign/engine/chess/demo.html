<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Blocks Testbed</title>
  <!-- A testbed for the chess blocks, like ../showcase.html for the lesson blocks.
       The checks here are graded by a stand-in in this page, not by the server:
       on a real level the answer never reaches the browser. -->
  <style>
    body { margin: 0; background: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; display: flex; flex-direction: column; gap: 22px; }
    h1 { font-size: 1.2rem; margin: 0; }
    p.lead { margin: 0; color: #94a3b8; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Chess blocks testbed</h1>
    <p class="lead">Check_Board, Chess_Position, Chess_PlayOut (with its game review) and Chess_Guided with sample data. Checks here are graded in the page for testing only. The puzzle trainer is on <a href="puzzles.html" style="color:#38bdf8">its own page</a>.</p>
    <section data-block="Check_Board" id="check"></section>
    <section data-block="Chess_Position" id="position"></section>
    <section data-block="Chess_PlayOut" id="playout"></section>
    <section data-block="Chess_Guided" id="guided1"></section>
    <section data-block="Chess_Guided" id="guided2"></section>
    <section data-block="Chess_Guided" id="guided3"></section>
    <section id="player" class="card"></section>
  </main>
  <script src="chess-core.js"></script>
  <script src="board.js"></script>
  <script src="bot.js"></script>
  <script src="teach.js"></script>
  <script src="../checks/checks-common.js"></script>
  <script src="chess-blocks.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/player.js"></script>
  <script src="demo.js"></script>
</body>
</html>
