<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Sparring</title>
  <!-- A game against a human-like opponent: the server answers each move from the
       CC0 opening book, then Maia-2 (MIT) at the chosen rating; below 1000, or when
       the server has no Maia-2, the app's own bot (bot.js) plays. -->
  <style>
    body { margin: 0; background: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 18px 16px 60px; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 1.25rem; margin: 0; }
    a { color: #38bdf8; }
    label { font-size: .9rem; color: #cbd5e1; display: flex; flex-direction: column; gap: 4px; }
    select { min-height: 44px; border-radius: 10px; border: 1px solid #334155; background: #111827; color: #f8fafc; font: inherit; padding: 0 10px; }
    .setup { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    button { min-height: 44px; padding: 0 14px; border: 1px solid #334155; border-radius: 10px; background: #111827; color: #f8fafc; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary { background: #38bdf8; color: #090d16; border-color: #38bdf8; }
    button:focus-visible, select:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
    .card { background: #111827; border: 1px solid #1f293d; border-radius: 12px; padding: 14px; }
    .say { margin: 10px 0 0; min-height: 1.5em; text-align: center; font-size: 15px; line-height: 1.5; }
    .muted { color: #94a3b8; font-size: .85rem; }
    .opening { text-align: center; color: #cbd5e1; font-size: .9rem; min-height: 1.3em; margin: 6px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Play a human-like opponent</h1>
    <div class="setup">
      <label>Opponent's rating
        <select id="elo">
          <option value="600">600 (beginner bot)</option>
          <option value="900">900 (beginner bot)</option>
          <option value="1100">1100</option>
          <option value="1300" selected>1300</option>
          <option value="1500">1500</option>
          <option value="1700">1700</option>
          <option value="1900">1900</option>
          <option value="2100">2000+</option>
        </select>
      </label>
      <label>You play
        <select id="side"><option value="w">White</option><option value="b">Black</option></select>
      </label>
      <button type="button" id="start" class="primary">New game</button>
    </div>
    <section class="card">
      <div id="board"></div>
      <p class="opening" id="opening"></p>
      <p class="say" id="say" role="status"></p>
    </section>
    <p class="muted">From 1100 up the opponent is Maia-2 (University of Toronto CSSLab, MIT licence), trained to play the moves people of that rating play, after an opening book from the CC0 Lichess opening list. Below that it is our own practice bot. <a href="puzzles.html">Puzzles</a> · <a href="drills.html">Move trainer</a> · <a href="NOTICES.txt">Credits</a></p>
  </main>
  <script src="chess-core.js"></script>
  <script src="bot.js"></script>
  <script src="board.js"></script>
  <script src="spar.js"></script>
</body>
</html>
