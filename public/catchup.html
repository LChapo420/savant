<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catch me up | Savant</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .cu { max-width: 640px; margin: 0 auto; display: grid; gap: var(--s-4); }
    .cu h1, .cu h2, .cu h3, .cu p { margin: 0; overflow-wrap: anywhere; }
    .cu__prompt { font-size: 1.25rem; line-height: 1.4; font-weight: 700; white-space: pre-line; }
    .cu__choices { display: grid; gap: var(--s-2); }
    .cu__choices .btn { width: 100%; justify-content: flex-start; text-align: left; height: auto; min-height: 48px; padding-block: 10px; }
    .cu__counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
    .cu__count { padding: var(--s-3); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
    .cu__count b { display: block; font-size: 1.375rem; }
    .cu__count span { color: var(--ink-2); font-size: 0.8125rem; }
    .cu__blocks { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s-3); }
    .cu__block { border: 1px solid var(--line); border-radius: 12px; padding: var(--s-3) var(--s-4); display: grid; gap: 4px; }
    .cu__block[data-status="done"] { border-color: var(--correct); }
    .cu__block[data-current="true"] { border-color: var(--subj); }
    .cu__meta { color: var(--ink-2); font-size: 0.875rem; }
    .cu__fb[data-ok="true"] { color: var(--correct); font-weight: 700; }
    .cu__fb[data-ok="false"] { color: var(--incorrect); font-weight: 700; }
  </style>
</head>
<body>
  <header class="site-header" id="header"></header>
  <main class="page">
    <div class="wrap" id="root"><div class="loading"><span class="spinner"></span>Loading</div></div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/catchup.js"></script>
</body>
</html>
