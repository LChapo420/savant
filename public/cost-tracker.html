<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cost tracker | Savant</title>
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/style-boot.js"></script>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .ct h2 { margin: 24px 0 8px; font-size: 1.1rem; }
    .ct .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .ct table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
    .ct th, .ct td { padding: 5px 8px; border-bottom: 1px solid var(--border, #ddd); text-align: right; white-space: nowrap; }
    .ct th:first-child, .ct td:first-child { text-align: left; position: sticky; left: 0; background: var(--bg, #fff); }
    .ct th { font-weight: 600; color: var(--muted, #666); }
    .ct .note { color: var(--muted, #666); font-size: .85rem; margin: 4px 0 8px; }
    .ct .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
    .ct .tile { border: 1px solid var(--border, #ddd); border-radius: 10px; padding: 10px 12px; }
    .ct .tile b { display: block; font-size: 1.25rem; }
    .ct .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  </style>
</head>
<body>
  <header class="site-header" id="header"></header>
  <main class="page">
    <div class="wrap ct" id="root">
      <div class="loading"><span class="spinner"></span>Loading</div>
    </div>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cost-tracker.js"></script>
</body>
</html>
