<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline: Savant</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <section class="wrap" style="padding-block: 3rem; max-width: 36rem;">
      <h1>You're offline</h1>

      <p>Reconnect, then try again.</p>
      <p><button type="button" class="btn" id="retry">Try again</button></p>
    </section>
  </main>
  <script src="/js/app.js" defer></script>
  <script src="/js/offline.js" defer></script>
</body>
</html>
